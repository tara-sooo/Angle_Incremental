<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Angle Incremental Issue Dependency Graph</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="heading">
      <h1>Angle Incremental Issue Dependency Graph</h1>
      <p id="status" aria-live="polite">GitHub Issues を読み込み中…</p>
    </div>
    <div class="toolbar" aria-label="表示操作">
      <button id="zoomOut" type="button" title="縮小">−</button>
      <button id="zoomIn" type="button" title="拡大">＋</button>
      <button id="fit" type="button">全体表示</button>
      <button id="refresh" type="button">再読込</button>
    </div>
  </header>

  <section class="controls" aria-label="グラフの絞り込み">
    <label><input id="showOpen" type="checkbox" checked> Open</label>
    <label><input id="showClosed" type="checkbox" checked> Completed</label>
    <label><input id="showHard" type="checkbox" checked> Hard dependency</label>
    <label><input id="showSoft" type="checkbox" checked> Reference / hierarchy</label>
    <label>Issue ≥ <input id="minIssue" type="number" value="95" min="1" inputmode="numeric"></label>
    <input id="search" type="search" placeholder="Issue番号・タイトルを検索" aria-label="Issueを検索">
  </section>

  <section class="legend-bar" aria-label="凡例">
    <span><i class="legend-line hard"></i> Hard dependency</span>
    <span><i class="legend-line soft"></i> Reference / hierarchy</span>
    <span>ドラッグ: 移動 · ホイール/ピンチ: 拡大縮小 · ノード: 詳細</span>
  </section>

  <main>
    <div id="graphShell" class="graph-shell">
      <svg id="graph" role="img" aria-label="Issue dependency graph">
        <defs>
          <marker id="arrowHard" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" class="arrow-hard"></path>
          </marker>
          <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" class="arrow-soft"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div id="emptyState" class="empty-state" hidden>表示条件に一致するIssueがありません。</div>
    </div>
  </main>

  <aside id="details" class="details" hidden aria-label="Issue詳細">
    <button id="closeDetails" class="close" type="button" aria-label="詳細を閉じる">×</button>
    <div id="detailsBody"></div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
