name: Publish 0.10.0

on:
  push:
    branches:
      - release/0.10.0
    paths:
      - .github/workflows/publish-0.10.0.yml

permissions:
  contents: write
  pages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released main commit
        uses: actions/checkout@v4
        with:
          ref: 6e8d3ca81e437d4b30e5fe8387cc4f406438d6fc
          fetch-depth: 0

      - name: Create annotated v0.10.0 tag
        run: |
          if git rev-parse --verify --quiet refs/tags/v0.10.0; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.10.0 6e8d3ca81e437d4b30e5fe8387cc4f406438d6fc -m "Angle Incremental 0.10.0"
          git push origin refs/tags/v0.10.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Angle Incremental 0.10.0

          ### 主な変更

          - Time Fluxをプレイヤー向け機能とUIから一時的に削除しました。旧セーブの関連値は将来の再導入に備えて保持し、離席時間は通常のオフライン進行として処理します。
          - Infinite Angle／Tower進行に対応する実績32〜37を追加し、32件を超える解除状態を安全に保存できるようにしました。
          - Infinity Upgrade 14-1を追加し、IU11-2のInfinity回数ハードキャップを10,000から30,000へ延長できるようにしました。
          - 「頂点通過ごとの増加」をスコアと同じ数値表記設定へ統一しました。
          - TC1・TC2報酬をTower階層に応じてスケーリングさせ、TC2の目標を1e1555 Scoreへ変更しました。

          ### 信頼性と互換性

          - 複数タブ間のセーブ競合検出、ロード失敗後のチェックポイント復旧、自動画質調整を改善しました。
          - `SAVE_VERSION`は10のままです。既存v10セーブ、休眠中のTime Flux値、実績・IU・Tower／TC状態、チェックポイント、セーブコード、復旧、Undoとの互換性を維持します。
          - 構文検査、ESM回帰テスト、デスクトップ／モバイルのブラウザスモーク、性能スモークを通過しています。

          実装範囲: #70, #71, #72, #73, #74
          EOF
          gh release create v0.10.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Angle Incremental 0.10.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify publication and record marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url="$(gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          git fetch origin release/0.10.0
          git checkout -B release/0.10.0 origin/release/0.10.0
          printf 'tag=v0.10.0\nrelease_url=%s\ntarget=6e8d3ca81e437d4b30e5fe8387cc4f406438d6fc\n' "$release_url" > .release-0.10.0-published
          git add .release-0.10.0-published
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record 0.10.0 publication verification"
            git push origin HEAD:release/0.10.0
          fi

      - name: Verify GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_json="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || true)"
          git fetch origin release/0.10.0
          git checkout -B release/0.10.0 origin/release/0.10.0
          if [ -z "$pages_json" ]; then
            printf 'pages_configured=false\n' > .release-0.10.0-live-check
          else
            page_url="$(printf '%s' "$pages_json" | jq -r '.html_url // empty')"
            page_status="$(printf '%s' "$pages_json" | jq -r '.status // empty')"
            http_status=""
            live_version=""
            for attempt in $(seq 1 12); do
              http_status="$(curl -L -sS -o "$RUNNER_TEMP/live-version.json" -w '%{http_code}' "${page_url%/}/version.json?release=0.10.0" || true)"
              live_version="$(jq -r '.appVersion // empty' "$RUNNER_TEMP/live-version.json" 2>/dev/null || true)"
              if [ "$http_status" = "200" ] && [ "$live_version" = "0.10.0" ]; then
                break
              fi
              sleep 5
            done
            printf 'pages_configured=true\npage_url=%s\npage_status=%s\nhttp_status=%s\napp_version=%s\n' \
              "$page_url" "$page_status" "$http_status" "$live_version" > .release-0.10.0-live-check
          fi
          git add .release-0.10.0-live-check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record 0.10.0 live deployment check"
            git push origin HEAD:release/0.10.0
          fi
