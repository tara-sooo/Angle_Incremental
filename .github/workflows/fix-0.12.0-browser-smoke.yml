name: Fix 0.12.0 Browser Release Assertions

on:
  pull_request:
    branches:
      - "release/**"
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'chore/0.12.0-release-prep' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Update release-specific browser assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  assert.match(updateModal.summary, /オフライン進行/);\n  assert.match(updateModal.summary, /Infinite Angle/);\n  assert.match(updateModal.canvas, /Auto Infinity/);\n  assert.match(updateModal.canvas, /応答性/);'''
          new = '''  assert.match(updateModal.summary, /Tower Challenge 4/);\n  assert.match(updateModal.summary, /Eternity/);\n  assert.match(updateModal.canvas, /1\\.80e308 IP/);\n  assert.match(updateModal.canvas, /Milestone 1-1〜5/);'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy release-copy assertion block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-0.12.0-browser-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-smoke.mjs
          git commit -m "Update browser smoke for 0.12.0 release copy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
