name: Prepare 0.12.1 Hotfix

on:
  push:
    branches:
      - hotfix/0.12.1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/0.12.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in [
              "src/core/constants.js",
              "version.json",
              "index.html",
              "src/ui/events.js",
              "src/ui/render-eternity.js",
          ]:
              path = Path(filename)
              text = path.read_text()
              path.write_text(text.replace("0.12.0", "0.12.1"))

          replacements = {
              "Tower Challenge 4と第4リセット層Eternityを追加しました。": "Eternityを独立したメインタブへ移動し、UIレイアウトを修正しました。",
              "TC4では専用強化A/B/Cを使って1e7777 Scoreを目指し、クリアがEternity条件になります。": "EternityをInfinity内のサブタブから独立したメインタブへ移動しました。",
              "TC4クリア済みの周回で1.80e308 IPに到達するとEternityが発生し、Milestone 1-1〜5が進行します。": "InfinityのサブタブをUpgrades / Infinite Angle / Towerの3つに戻し、レイアウト崩れを修正しました。",
              "セーブ形式10は変更ありません。既存セーブをそのまま利用でき、実績は41個になりました。": "ゲーム進行・バランス・セーブ形式10に変更はありません。",
          }
          index_path = Path("index.html")
          index = index_path.read_text()
          for old, new in replacements.items():
              index = index.replace(old, new)
          index_path.write_text(index)

          i18n_path = Path("src/data/i18n.js")
          i18n = i18n_path.read_text()
          for old, new in {
              'updateTitle: "0.12.0 アップデート"': 'updateTitle: "0.12.1 アップデート"',
              'updateSummary: "Tower Challenge 4と第4リセット層Eternityを追加しました。"': 'updateSummary: "Eternityを独立したメインタブへ移動し、UIレイアウトを修正しました。"',
              'updateResetDock: "TC4では専用強化A/B/Cを使って1e7777 Scoreを目指し、クリアがEternity条件になります。"': 'updateResetDock: "EternityをInfinity内のサブタブから独立したメインタブへ移動しました。"',
              'updateCanvas: "TC4クリア済みの周回で1.80e308 IPに到達するとEternityが発生し、Milestone 1-1〜5が進行します。"': 'updateCanvas: "InfinityのサブタブをUpgrades / Infinite Angle / Towerの3つに戻し、レイアウト崩れを修正しました。"',
              'updateModalNote: "セーブ形式10は変更ありません。既存セーブをそのまま利用でき、実績は41個になりました。"': 'updateModalNote: "ゲーム進行・バランス・セーブ形式10に変更はありません。"',
              'updateTitle: "Version 0.12.0"': 'updateTitle: "Version 0.12.1"',
              'updateSummary: "Added Tower Challenge 4 and the fourth reset layer, Eternity."': 'updateSummary: "Moved Eternity to its own main tab and repaired the release UI layout."',
              'updateResetDock: "TC4 uses three dedicated upgrades to reach 1e7777 Score, and clearing it becomes part of the Eternity requirement."': 'updateResetDock: "Eternity is now an independent top-level tab instead of an Infinity subtab."',
              'updateCanvas: "After clearing TC4 in the current run, reaching 1.80e308 IP triggers Eternity and advances Milestones 1-1 through 5."': 'updateCanvas: "Infinity is back to its three subtabs: Upgrades, Infinite Angle, and Tower."',
              'updateModalNote: "Save format 10 is unchanged, existing saves remain compatible, and there are now 41 achievements."': 'updateModalNote: "Gameplay progression, balance, and save format 10 are unchanged."',
          }.items():
              i18n = i18n.replace(old, new)
          i18n_path.write_text(i18n)

          browser_path = Path("tests/browser-smoke.mjs")
          browser = browser_path.read_text()
          browser = browser.replace(
              '  assert.match(updateModal.summary, /Tower Challenge 4/);\n  assert.match(updateModal.summary, /Eternity/);\n  assert.match(updateModal.canvas, /1\\.80e308 IP/);\n  assert.match(updateModal.canvas, /Milestone 1-1〜5/);',
              '  assert.match(updateModal.summary, /Eternity/);\n  assert.match(updateModal.summary, /独立/);\n  assert.match(updateModal.canvas, /Infinity/);\n  assert.match(updateModal.canvas, /3つ/);',
          )
          browser_path.write_text(browser)

          Path("docs/releases/0.12.1.md").write_text("""## Angle Incremental 0.12.1

### 修正

- EternityをInfinity内のサブタブから分離し、独立したトップレベルのメインタブへ移動しました。
- Infinityのサブタブ構成を `Upgrades / Infinite Angle / Tower` の3つへ戻しました。
- 0.12.0で発生していたEternity UIのレイアウト崩れを修正しました。
- ブラウザ/E2E回帰テストで、Eternityが独立タブであることとInfinity側にEternityサブタブが存在しないことを検証します。

### 互換性

`SAVE_VERSION` は10のままです。TC4、Eternity条件、Milestone、実績、Time Flux保持を含むゲーム進行・バランス・セーブ仕様に変更はありません。

このリリースはUI/navigationのみのパッチです。Eternity Point / EP、Break Eternity、追加Milestoneなどの新しいゲーム要素は導入しません。

関連: #163, #164
""")
          PY

          npm ci
          npm run check:version
          npm run check:syntax
          git diff --check

      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/prepare-0.12.1-hotfix.yml
          rm -f .hotfix-0.12.1-trigger
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Prepare 0.12.1 UI hotfix release"
          git push origin HEAD:hotfix/0.12.1
