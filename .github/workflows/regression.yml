name: Regression Suite

on:
  pull_request:
    branches:
      - main
      - next
      - "release/**"
  push:
    branches:
      - main
      - next

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify ESM entrypoint order
        run: npm run check:runtime-order
      - name: Check syntax
        run: npm run check:syntax
      - name: Check version consistency
        run: npm run check:version
      - name: Check IDD review policy
        run: npm run check:idd-policy
      - name: Run ESM regression suite
        run: npm run test:regression
      - name: Install Chromium for browser smoke test
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run browser ESM smoke test
        run: npm run test:browser
      - name: Test local performance gate classifier
        run: npm run test:local-performance-gate
      - name: Run performance smoke test
        run: npm run test:performance
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            browser-smoke-report.json
            output/performance-smoke.json
            regression-failure.txt
          if-no-files-found: warn

  prepare-0-12-2-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/run-clean-0.12.2-preparer-ci'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted helper from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: helper
      - name: Check out clean release branch
        uses: actions/checkout@v4
        with:
          ref: release-clean-0.12.2
          path: release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare and fully validate 0.12.2
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          python ../helper/scripts/prepare-0.12.2-release.py
          npm ci
          npm run validate
          git diff --check
      - name: Commit prepared clean 0.12.2 release
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 0.12.2 release"
          git push origin HEAD:release-clean-0.12.2
