name: Rescope PR 69

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rescope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply rescope patch
        run: |
          base64 --decode .github/pr69-rescope.patch.gz.b64 | gzip --decompress > /tmp/pr69-rescope.patch
          git apply --check --exclude=.github/workflows/regression.yml /tmp/pr69-rescope.patch
          git apply --exclude=.github/workflows/regression.yml /tmp/pr69-rescope.patch
          rm .github/pr69-rescope.patch.gz.b64
          cat > .github/workflows/regression.yml <<'YAML'
          name: Regression Suite

          on:
            pull_request:
              branches:
                - main
                - next
                - "release/**"
            push:
              branches:
                - main
                - next
                - "release/**"

          jobs:
            regression:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Verify ESM entrypoint order
                  run: node scripts/check-runtime-esm-loader-order.js
                - name: Check syntax
                  run: |
                    node --check regression-tests-esm.js
                    find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
                - name: Run ESM regression suite
                  run: node --experimental-vm-modules regression-tests-esm.js
                - name: Install Chromium for browser smoke test
                  run: |
                    npm install --no-save --ignore-scripts playwright
                    npx playwright install --with-deps chromium
                - name: Run browser ESM smoke test
                  run: node tests/browser-smoke.mjs
                - name: Run performance smoke test
                  run: node tests/performance-smoke.mjs
                - name: Upload test diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: test-diagnostics
                    path: |
                      browser-smoke-report.json
                      output/performance-smoke.json
                      regression-failure.txt
                    if-no-files-found: warn
          YAML
          git diff --check
          if rg -n '0\.9\.1|TIME_FLUX_CAPACITY_SECONDS_BY_LEVEL|TIME_FLUX_MAX_CAPACITY_LEVEL|clampTimeFluxCapacityLevel|段階式Time Flux|staged Time Flux' .; then
            echo 'Found stale release or staged Time Flux references' >&2
            exit 1
          fi
      - name: Verify ESM entrypoint order
        run: node scripts/check-runtime-esm-loader-order.js
      - name: Check syntax
        run: |
          node --check regression-tests-esm.js
          find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run ESM regression suite
        run: node --experimental-vm-modules regression-tests-esm.js
      - name: Install Chromium for browser smoke test
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run browser ESM smoke test
        run: node tests/browser-smoke.mjs
      - name: Run performance smoke test
        run: node tests/performance-smoke.mjs
      - name: Commit rescope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rescope PR as infrastructure improvements"
          git push origin HEAD:release/0.9.1
