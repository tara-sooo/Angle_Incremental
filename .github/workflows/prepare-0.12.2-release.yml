name: Prepare 0.12.2 Release

on:
  pull_request_target:
    types:
      - synchronize
      - ready_for_review
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-0.12.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.12.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare 0.12.2 metadata and release copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise SystemExit(f"{label}: expected one old match or prepared value, found {count}")
              return text.replace(old, new, 1)

          for filename in [
              "src/core/constants.js",
              "version.json",
              "index.html",
              "src/ui/events.js",
              "src/ui/render-eternity.js",
          ]:
              path = Path(filename)
              text = path.read_text()
              path.write_text(text.replace("0.12.0", "0.12.2"))

          index_path = Path("index.html")
          index = index_path.read_text()
          for old, new, label in [
              ("Tower Challenge 4と第4リセット層Eternityを追加しました。", "Eternityの初回フローとTC4 / Eternityタブ表示を修正しました。", "index update summary"),
              ("TC4では専用強化A/B/Cを使って1e7777 Scoreを目指し、クリアがEternity条件になります。", "TC4クリア + 1.80e308 IPでEternityが利用可能になり、条件達成だけでは自動実行されなくなりました。", "index update first bullet"),
              ("TC4クリア済みの周回で1.80e308 IPに到達するとEternityが発生し、Milestone 1-1〜5が進行します。", "Milestone 1-1〜1-3はEternity後に取得でき、未使用の取得権は保持されます。TC4タイトルとEternityタブのレスポンシブ表示も修正しました。", "index update second bullet"),
              ("セーブ形式10は変更ありません。既存セーブをそのまま利用でき、実績は41個になりました。", "セーブ形式10は変更ありません。Milestone 1-1文言、Milestone 2〜5、TC4バランスは変更していません。", "index update compatibility note"),
          ]:
              index = replace_once(index, old, new, label)
          index_path.write_text(index)

          i18n_path = Path("src/data/i18n.js")
          i18n = i18n_path.read_text()
          for old, new, label in [
              ('updateTitle: "0.12.0 アップデート"', 'updateTitle: "0.12.2 アップデート"', "Japanese update title"),
              ('updateSummary: "Tower Challenge 4と第4リセット層Eternityを追加しました。"', 'updateSummary: "Eternityの初回フローとTC4 / Eternityタブ表示を修正しました。"', "Japanese update summary"),
              ('updateResetDock: "TC4では専用強化A/B/Cを使って1e7777 Scoreを目指し、クリアがEternity条件になります。"', 'updateResetDock: "TC4クリア + 1.80e308 IPでEternityが利用可能になり、条件達成だけでは自動実行されなくなりました。"', "Japanese update first bullet"),
              ('updateCanvas: "TC4クリア済みの周回で1.80e308 IPに到達するとEternityが発生し、Milestone 1-1〜5が進行します。"', 'updateCanvas: "Milestone 1-1〜1-3はEternity後に取得でき、未使用の取得権は保持されます。TC4タイトルとEternityタブのレスポンシブ表示も修正しました。"', "Japanese update second bullet"),
              ('updateModalNote: "セーブ形式10は変更ありません。既存セーブをそのまま利用でき、実績は41個になりました。"', 'updateModalNote: "セーブ形式10は変更ありません。Milestone 1-1文言、Milestone 2〜5、TC4バランスは変更していません。"', "Japanese update note"),
              ('updateTitle: "Version 0.12.0"', 'updateTitle: "Version 0.12.2"', "English update title"),
              ('updateSummary: "Added Tower Challenge 4 and the fourth reset layer, Eternity."', 'updateSummary: "Corrected the first Eternity flow and the TC4 / Eternity-tab presentation."', "English update summary"),
              ('updateResetDock: "TC4 uses three dedicated upgrades to reach 1e7777 Score, and clearing it becomes part of the Eternity requirement."', 'updateResetDock: "After clearing TC4 and reaching 1.80e308 IP, Eternity becomes available for manual activation instead of triggering automatically."', "English update first bullet"),
              ('updateCanvas: "After clearing TC4 in the current run, reaching 1.80e308 IP triggers Eternity and advances Milestones 1-1 through 5."', 'updateCanvas: "First-tier Milestones 1-1 through 1-3 are acquired after Eternity, unused acquisition rights persist, and the TC4 title / Eternity responsive tab layout are fixed."', "English update second bullet"),
              ('updateModalNote: "Save format 10 is unchanged, existing saves remain compatible, and there are now 41 achievements."', 'updateModalNote: "Save format 10 is unchanged. Milestone 1-1 wording, Milestones 2-5, and TC4 balance are unchanged."', "English update note"),
          ]:
              i18n = replace_once(i18n, old, new, label)
          i18n_path.write_text(i18n)

          browser_path = Path("tests/browser-smoke.mjs")
          browser = browser_path.read_text()
          browser = replace_once(
              browser,
              '  assert.match(updateModal.summary, /Tower Challenge 4/);\n  assert.match(updateModal.summary, /Eternity/);\n  assert.match(updateModal.canvas, /1\\.80e308 IP/);\n  assert.match(updateModal.canvas, /Milestone 1-1〜5/);',
              '  assert.match(updateModal.summary, /Eternity/);\n  assert.match(updateModal.summary, /修正/);\n  assert.match(updateModal.canvas, /Milestone 1-1〜1-3/);\n  assert.match(updateModal.canvas, /TC4/);',
              "browser update-modal assertions",
          )
          browser_path.write_text(browser)

          Path("docs/releases/0.12.2.md").write_text("""## Angle Incremental 0.12.2

### Eternity

- 現在の周回でTC4をクリアし、`1.80e308 IP`に到達するとEternityが利用可能になり、明示的なボタン操作で実行する方式へ変更しました。
- 条件達成時にEternityが自動実行される挙動を廃止しました。
- Milestone 1-1 / 1-2 / 1-3の事前予約を廃止し、成功したEternity後に未取得のMilestoneを取得する方式へ変更しました。
- 未使用のfirst-tier取得権は失われず、`min(Eternity回数, 3) - 取得済みTier1数`から導出されます。
- 旧`eternityMilestoneChoice`はセーブ互換用に保持しますが、ゲーム進行には使用しません。

### UI

- TC4のタイトル`TC4 既存品の代替`を復元しました（英語: `TC4 Substitute for Existing Products`）。
- タブレット/モバイル幅でEternityメインタブだけ大きくなる0.12.1のレスポンシブ表示を修正しました。

### 互換性 / 対象外

- `SAVE_VERSION`は10のままです。
- Milestone 1-1の文言は変更していません。
- Milestone 1-3は再確認の結果、現行実装が仕様通りのため変更していません。
- Milestone 2〜5の監査・変更は0.12.2では実施していません。
- TC4の係数・価格・数式・専用強化UIは変更していません。
- Eternity Point / EP、Break Eternityは導入していません。

関連: #166, #167, #168, #171, #170, #172, #173
""")
          PY

          npm ci
          npm run check:version
          npm run check:syntax
          git diff --check

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/prepare-0.12.2-release.yml .prepare-0.12.2-trigger
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Prepare 0.12.2 release"
          git push origin HEAD:release-0.12.2
